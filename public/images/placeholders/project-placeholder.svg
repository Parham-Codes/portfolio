<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Dark Architectural Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Subtle Radial Highlight -->
    <radialGradient id="radialGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Wireframe Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#gridPattern)" />
  <rect width="1200" height="750" fill="url(#radialGlow)" />

  <!-- Outer Blueprint Frame -->
  <rect x="60" y="50" width="1080" height="650" rx="20" fill="#0d1424" fill-opacity="0.4" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Window Header Bar -->
  <rect x="60" y="50" width="1080" height="52" rx="20" fill="#131c2e" fill-opacity="0.6" />
  <rect x="60" y="82" width="1080" height="20" fill="#131c2e" fill-opacity="0.6" />
  <line x1="60" y1="102" x2="1140" y2="102" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="95" cy="76" r="6" fill="#ef4444" fill-opacity="0.6" />
  <circle cx="115" cy="76" r="6" fill="#f59e0b" fill-opacity="0.6" />
  <circle cx="135" cy="76" r="6" fill="#10b981" fill-opacity="0.6" />

  <!-- Window Address Pill -->
  <rect x="360" y="64" width="480" height="24" rx="6" fill="#080c14" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <text x="600" y="80" fill="#87929a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle">
    project // preview-pending.dev
  </text>

  <!-- Corner Guide Markers -->
  <path d="M 85 130 L 85 145 M 85 130 L 100 130" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 1115 130 L 1115 145 M 1115 130 L 1100 130" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 85 670 L 85 655 M 85 670 L 100 670" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 1115 670 L 1115 655 M 1115 670 L 1100 670" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />

  <!-- Center Wireframe / Graphic Area -->
  <g transform="translate(600, 340)">
    <!-- Central Icon Badge Container -->
    <rect x="-44" y="-70" width="88" height="88" rx="22" fill="#182338" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Layers / Wireframe Icon -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top layer -->
      <polygon points="0,-48 24,-36 0,-24 -24,-36" />
      <!-- Middle layer -->
      <path d="M -24,-26 L 0,-14 L 24,-26" />
      <!-- Bottom layer -->
      <path d="M -24,-16 L 0,-4 L 24,-16" />
    </g>

    <!-- Monospace Status Pill -->
    <rect x="-95" y="40" width="190" height="28" rx="14" fill="#132034" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="-75" cy="54" r="3.5" fill="#38bdf8" />
    <text x="5" y="58" fill="#bae6fd" font-family="'Courier New', Courier, monospace, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
      PREVIEW PENDING
    </text>

    <!-- Main Title -->
    <text x="0" y="105" fill="#dfe2ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3" text-anchor="middle">
      تصویر پیش‌نمایش به‌زودی بارگذاری می‌شود
    </text>

    <!-- Subtitle (Persian & English) -->
    <text x="0" y="135" fill="#87929a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" text-anchor="middle">
      Visual assets and high-res screenshots will appear here once ready
    </text>
  </g>

  <!-- Bottom Technical Legend -->
  <text x="90" y="665" fill="#ffffff" fill-opacity="0.25" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="1">
    ASSET: PLACEHOLDER_FRAME_V1
  </text>
  <text x="1110" y="665" fill="#ffffff" fill-opacity="0.25" font-family="'Courier New', Courier, monospace" font-size="10" letter-spacing="1" text-anchor="end">
    STATUS: ASSETS PENDING
  </text>
</svg>
